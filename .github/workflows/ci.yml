name: CI
 
on:
  push:
  pull_request:
 
jobs:
  cpp:
    name: C++ build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Configure
        run: cmake -S simulation -B simulation/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build simulation/build --parallel
      - name: Test
        run: ctest --test-dir simulation/build --output-on-failure
 
  python:
    name: Python lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + package)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # Exit code 5 = "no tests collected"; treat that as success until tests exist.
        run: pytest -q || [ "$?" -eq 5 ]
 